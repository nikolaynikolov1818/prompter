<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Промптър</title>
<meta name="theme-color" content="#14161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Промптър">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EC; --surface:#FFFFFF; --ink:#16171C; --muted:#646875; --line:#DDDAD3; --soft:#E9E6E0;
  --rec:#E5322D; --rec-ink:#FFFFFF; --hi:#FFD43B;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#14161C; --surface:#1D2028; --ink:#F1EFEA; --muted:#9A9DA8; --line:#2E323C; --soft:#262A33; --rec:#FF4A42; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#14161C; --surface:#1D2028; --ink:#F1EFEA; --muted:#9A9DA8; --line:#2E323C; --soft:#262A33; --rec:#FF4A42; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rec);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em}
h1 .dot{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--rec);margin-left:.15em;vertical-align:.15em}
.sub{color:var(--muted);margin:0 0 18px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:var(--ink);color:var(--bg)}
.btn.rec{background:var(--rec);color:var(--rec-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:.92rem;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.item h2{font-size:1.05rem;margin:0 0 4px;font-weight:800}
.item p{margin:0 0 12px;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-weight:700}
input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:46vh;resize:vertical;line-height:1.6}
.note{color:var(--muted);font-size:.88rem;margin:6px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:18px}
.settings h3{margin:0 0 6px;font-size:1rem}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}
.srow input[type=range]{flex:1;max-width:260px;accent-color:var(--rec)}
.srow output{min-width:3.5em;text-align:right;font-weight:800}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;margin:12px 0}
.chk input{width:22px;height:22px;accent-color:var(--rec)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:0;font-weight:800;padding:8px 0;color:var(--muted)}

/* ---- промптър ---- */
.stage{position:fixed;inset:0;background:#0B0C10;color:#F6F3EC;z-index:20;overflow:hidden;touch-action:manipulation}
.stage.mirror .ptext,.stage.mirror .pts{transform-origin:center}
.viewport{position:absolute;inset:0;overflow:hidden}
.ptext{position:absolute;left:0;right:0;top:0;padding:0 7vw;font-weight:800;line-height:1.35;will-change:transform}
.ptext p{margin:0 0 .8em}
.ptext p::before{content:"–";color:#FFD43B;margin-right:.35em}
.guide{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(255,212,59,.55);pointer-events:none}
.guide::before{content:"▶";position:absolute;left:6px;top:-.85em;color:#FFD43B;font-size:1.1rem}
.fade{position:absolute;left:0;right:0;pointer-events:none}
.pts{position:absolute;left:0;right:0;padding:0 7vw;text-align:left}
.pts .cur{font-weight:800;line-height:1.3}
.pts .nxt{opacity:.38;font-weight:700;margin-top:1em;line-height:1.3}
.pts .cnt{font-family:Unbounded,sans-serif;color:#FFD43B;font-size:.9rem;margin-bottom:.6em;letter-spacing:.04em}
.hud{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;transition:opacity .25s}
.hud.hide{opacity:0;pointer-events:none}
.hb{border:0;border-radius:14px;min-width:50px;height:50px;padding:0 14px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:1rem}
.hb.big{min-width:64px;height:64px;border-radius:50%;background:#fff;color:#0B0C10;font-size:1.4rem}
.hb.recb{min-width:72px;height:72px;border-radius:50%;background:transparent;border:4px solid #fff;padding:0;display:grid;place-items:center}
.hb.recb i{display:block;width:52px;height:52px;border-radius:50%;background:#E5322D;transition:all .2s}
.hb.recb.on i{width:28px;height:28px;border-radius:8px}
.chipv{font-family:Unbounded,sans-serif;font-size:.85rem;color:#fff;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:999px}
.tl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;align-items:center;z-index:3}
.tl .rec{background:#E5322D}
.cd{position:absolute;inset:0;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-size:30vmin;font-weight:800;color:#FFD43B;background:rgba(0,0,0,.4);z-index:4;pointer-events:none}
video.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
video.cam.selfie{transform:scaleX(-1)}
.camtext{position:absolute;left:0;right:0;top:0;height:46%;overflow:hidden;background:linear-gradient(to bottom,rgba(0,0,0,.78) 70%,rgba(0,0,0,0));padding-top:env(safe-area-inset-top,0px)}
.camtext .ptext{top:0}
.msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;z-index:2}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:40;padding:16px}
.sheet .box{background:var(--surface);color:var(--ink);border-radius:22px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}
.sheet video{width:100%;max-height:50vh;border-radius:14px;background:#000;display:block;margin:10px 0}
.sheet h2{margin:0;font-size:1.15rem}
.sheet .bar{justify-content:stretch}
.sheet .bar .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s;z-index:60;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.hud,.hb.recb i{transition:none}}
</style>
</head>
<body>

<!-- Начало -->
<main class="wrap" id="home">
  <h1>Промптър<span class="dot" aria-hidden="true"></span></h1>
  <p class="sub">Опорните ти точки пред очите, докато снимаш.</p>
  <button class="btn rec" id="newBtn" style="width:100%">+ Нов текст</button>
  <div class="list" id="list" style="margin-top:14px"></div>

  <div class="settings">
    <h3>Настройки</h3>
    <div class="srow"><label for="speedIn">Скорост на плъзгане</label><input type="range" id="speedIn" min="10" max="140" step="5"><output id="speedOut"></output></div>
    <div class="srow"><label for="sizeIn">Размер на текста</label><input type="range" id="sizeIn" min="22" max="80" step="2"><output id="sizeOut"></output></div>
    <label class="chk"><input type="checkbox" id="cdIn"> Отброяване 3‑2‑1 преди старт</label>
    <label class="chk"><input type="checkbox" id="mirIn"> Огледален текст (за стъкло на промптър)</label>
    <p class="note">Всичко се пази на този телефон.</p>
  </div>
</main>

<!-- Редактор -->
<main class="wrap" id="editor" hidden>
  <div class="top"><button class="back" id="edBack">‹ Назад</button><button class="btn sm ghost" id="edDel">Изтрий</button></div>
  <div class="field"><label for="tIn">Заглавие</label><input type="text" id="tIn" maxlength="80" placeholder="напр. „Ден 1: Кола без захар“"></div>
  <div class="field"><label for="bIn">Опорни точки</label>
    <textarea id="bIn" placeholder="Всяка точка на нов ред.&#10;Hook: …&#10;Точка 1…&#10;Точка 2…"></textarea>
    <p class="note">Всеки нов ред е отделна точка. Тирета и точки в началото не са нужни.</p>
  </div>
  <div class="bar">
    <button class="btn" id="edPlay">▶ Чети</button>
    <button class="btn rec" id="edCam">● Снимай с текста</button>
  </div>
</main>

<!-- Сцена: промптър / камера -->
<div class="stage" id="stage" hidden>
  <video class="cam" id="cam" playsinline muted hidden></video>
  <div class="msg" id="camMsg" hidden></div>
  <div class="viewport" id="vp">
    <div class="ptext" id="ptext"></div>
    <div class="pts" id="pts" hidden></div>
    <div class="guide" id="guide"></div>
  </div>
  <div class="tl"><span class="chipv" id="timer">0:00</span><span class="chipv rec" id="recDot" hidden>● REC</span></div>
  <div class="cd" id="cd" hidden></div>
  <div class="hud" id="hud">
    <button class="hb" id="hClose" aria-label="Затвори">✕</button>
    <button class="hb" id="hMode" aria-label="Смени режима">Плъзгане</button>
    <button class="hb" id="hSlow" aria-label="По-бавно">−</button>
    <button class="hb big" id="hPlay" aria-label="Пусни">▶</button>
    <button class="hb recb" id="hRec" aria-label="Запис" hidden><i></i></button>
    <button class="hb" id="hFast" aria-label="По-бързо">+</button>
    <button class="hb" id="hRestart" aria-label="Отначало">⟲</button>
    <button class="hb" id="hFlip" aria-label="Смени камерата" hidden>🔄</button>
    <button class="hb" id="hSize" aria-label="Размер на текста">Aa</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const KEY = "prompter-v1";
  const $ = id => document.getElementById(id);
  const el = (t,c,x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
  const uid = () => Math.random().toString(36).slice(2,9);
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  const EXAMPLES = [
    {title:"Ден 1: Кола без захар вредна ли е?", text:"Hook: „Пия това. Убива ли ме?“ (държиш кутийката)\nЗахар няма, калории практически няма\nПодсладителите са одобрени като безопасни в нормални количества\nСЗО: подсладителите не помагат за отслабване в дългосрочен план\nКофеинът е по-реалният проблем: сън и пулс\nМоето мнение: по-добре от нормалната кола, но водата е шефът\nФинал: „Вие пиете ли зеро? Пишете.“"},
    {title:"Старт: 30 дни, 30 видеа", text:"Hook: „На 15 съм. Следващите 30 дни качвам видео всеки ден.“\nКой съм и какво е HYROX\nПравилото: 30 дни, без пропуск\nКакво ще видите: тренировки, храна, сън, челинджи с брат ми\nАко пропусна ден, пишете ми\nФинал: „Ден 1 от 30. Да тръгваме.“"}
  ];
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!S || !Array.isArray(S.scripts)) S = { scripts: EXAMPLES.map(x => ({id:uid(), title:x.title, text:x.text, at:Date.now()})), speed:45, size:40, countdown:true, mirror:false, mode:"scroll", facing:"user" };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

  function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }
  const points = txt => txt.split(/\r?\n/).map(l => l.trim().replace(/^[-–—•*·]+\s*/, "")).filter(Boolean);

  // ---------- начало ----------
  function renderHome(){
    const list = $("list"); list.innerHTML = "";
    if (!S.scripts.length) list.append(el("p","note","Нямаш текстове. Натисни „+ Нов текст“."));
    S.scripts.slice().sort((a,b) => b.at - a.at).forEach(s => {
      const it = el("div","item");
      const n = points(s.text).length;
      it.append(el("h2", null, s.title || "Без заглавие"), el("p", null, n + (n === 1 ? " точка · " : " точки · ") + points(s.text).slice(0,2).join(" · ")));
      const a = el("div","acts");
      const p = el("button","btn sm","▶ Чети"); p.onclick = () => openStage(s, false);
      const c = el("button","btn sm rec","● Снимай"); c.onclick = () => openStage(s, true);
      const e = el("button","btn sm ghost","Редактирай"); e.onclick = () => openEditor(s);
      a.append(p, c, e); it.append(a); list.append(it);
    });
    $("speedIn").value = S.speed; $("speedOut").textContent = S.speed;
    $("sizeIn").value = S.size; $("sizeOut").textContent = S.size;
    $("cdIn").checked = S.countdown; $("mirIn").checked = S.mirror;
  }
  $("speedIn").oninput = e => { S.speed = +e.target.value; $("speedOut").textContent = S.speed; save(); };
  $("sizeIn").oninput = e => { S.size = +e.target.value; $("sizeOut").textContent = S.size; save(); };
  $("cdIn").onchange = e => { S.countdown = e.target.checked; save(); };
  $("mirIn").onchange = e => { S.mirror = e.target.checked; save(); };

  // ---------- редактор ----------
  let cur = null;
  function show(id){ ["home","editor"].forEach(x => $(x).hidden = x !== id); window.scrollTo(0,0); }
  function openEditor(s){
    cur = s; $("tIn").value = s.title; $("bIn").value = s.text; show("editor");
  }
  $("newBtn").onclick = () => { const s = {id:uid(), title:"", text:"", at:Date.now()}; S.scripts.push(s); save(); openEditor(s); $("tIn").focus(); };
  const syncEd = () => { if (!cur) return; cur.title = $("tIn").value.trim(); cur.text = $("bIn").value; cur.at = Date.now(); save(); };
  $("tIn").oninput = syncEd; $("bIn").oninput = syncEd;
  $("edBack").onclick = () => {
    if (cur && !cur.title && !cur.text.trim()) S.scripts = S.scripts.filter(x => x !== cur);
    save(); cur = null; renderHome(); show("home");
  };
  $("edDel").onclick = () => { if (!cur || !confirm("Да изтрия ли този текст?")) return; S.scripts = S.scripts.filter(x => x !== cur); save(); cur = null; renderHome(); show("home"); };
  $("edPlay").onclick = () => { syncEd(); if (!points(cur.text).length) { toast("Напиши поне една точка"); return; } openStage(cur, false); };
  $("edCam").onclick = () => { syncEd(); if (!points(cur.text).length) { toast("Напиши поне една точка"); return; } openStage(cur, true); };

  // ---------- сцена ----------
  let script = null, camMode = false, playing = false, offset = 0, last = 0, raf = 0, idx = 0;
  let stream = null, rec = null, chunks = [], recStart = 0, tick = 0, startedAt = 0, elapsed = 0, wake = null, hudTimer = 0;
  const vp = $("vp"), ptext = $("ptext"), pts = $("pts"), guide = $("guide");

  function layout(){
    const H = window.innerHeight;
    const area = camMode ? H*0.46 : H;
    const gy = camMode ? area*0.32 : H*0.28;
    guide.style.top = gy + "px";
    guide.hidden = S.mode !== "scroll";
    ptext.style.fontSize = (camMode ? Math.round(S.size*0.8) : S.size) + "px";
    pts.style.fontSize = (camMode ? Math.round(S.size*0.85) : Math.round(S.size*1.15)) + "px";
    pts.style.top = (camMode ? 16 + (parseInt(getComputedStyle(document.documentElement).paddingTop) || 0) : H*0.16) + "px";
    ptext.style.paddingTop = gy + "px";
    ptext.style.paddingBottom = H + "px";
    const flip = S.mirror && !camMode ? " scaleX(-1)" : "";
    ptext.style.transform = "translateY(" + (-offset) + "px)" + flip;
    pts.style.transform = flip ? "scaleX(-1)" : "";
  }
  function renderText(){
    const p = points(script.text);
    ptext.innerHTML = ""; p.forEach(t => ptext.append(el("p", null, t)));
    pts.innerHTML = "";
    if (S.mode === "points") {
      idx = Math.min(idx, p.length-1);
      pts.append(el("div","cnt", (idx+1) + " / " + p.length), el("div","cur", p[idx] || ""));
      if (p[idx+1]) pts.append(el("div","nxt", p[idx+1]));
    }
    ptext.hidden = S.mode !== "scroll"; pts.hidden = S.mode !== "points";
    $("hMode").textContent = S.mode === "scroll" ? "Плъзгане" : "По точки";
    $("hSlow").hidden = $("hFast").hidden = S.mode !== "scroll";
    layout();
  }
  function fmt(ms){ const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function runTimer(){ clearInterval(tick); tick = setInterval(() => { const ms = (recStart ? Date.now() - recStart : elapsed + (playing ? Date.now() - startedAt : 0)); $("timer").textContent = fmt(ms); }, 250); }

  function loop(t){
    if (!playing) return;
    const dt = last ? (t - last)/1000 : 0; last = t;
    offset += S.speed * dt * (camMode ? 0.85 : 1);
    const max = ptext.scrollHeight - window.innerHeight;
    if (offset >= max) { offset = max; pause(); }
    layout();
    raf = requestAnimationFrame(loop);
  }
  function play(){
    if (playing) return;
    playing = true; startedAt = Date.now(); last = 0;
    $("hPlay").textContent = "⏸"; $("hPlay").setAttribute("aria-label","Пауза");
    if (S.mode === "scroll") raf = requestAnimationFrame(loop);
    hudLater();
  }
  function pause(){
    if (!playing) return;
    playing = false; elapsed += Date.now() - startedAt; cancelAnimationFrame(raf);
    $("hPlay").textContent = "▶"; $("hPlay").setAttribute("aria-label","Пусни");
    showHud();
  }
  function countdown(){
    return new Promise(res => {
      if (!S.countdown) return res();
      const c = $("cd"); let n = 3; c.hidden = false; c.textContent = n;
      const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); c.hidden = true; res(); } else c.textContent = n; }, 800);
    });
  }
  async function togglePlay(){ if (playing) pause(); else { if (!elapsed && !offset && !camMode) await countdown(); play(); } }
  function restart(){ pause(); offset = 0; idx = 0; elapsed = 0; if (!recStart) $("timer").textContent = "0:00"; renderText(); }
  function next(dir){
    const n = points(script.text).length;
    idx = Math.max(0, Math.min(n-1, idx + dir));
    if (!playing && !camMode) { playing = true; startedAt = Date.now(); $("hPlay").textContent = "⏸"; }
    renderText();
  }

  function showHud(){ $("hud").classList.remove("hide"); clearTimeout(hudTimer); }
  function hudLater(){ clearTimeout(hudTimer); if (camMode) return; hudTimer = setTimeout(() => { if (playing) $("hud").classList.add("hide"); }, 1800); }

  async function lockScreen(){ try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch(e){} }

  async function openStage(s, withCam){
    script = s; camMode = withCam; offset = 0; idx = 0; elapsed = 0; playing = false; recStart = 0;
    $("stage").hidden = false; document.body.style.overflow = "hidden";
    $("hRec").hidden = !camMode; $("hPlay").hidden = camMode; $("hFlip").hidden = !camMode;
    $("cam").hidden = !camMode; $("recDot").hidden = true; $("timer").textContent = "0:00";
    $("hPlay").textContent = "▶";
    // текстът над камерата
    let wrapC = vp.querySelector(".camtext");
    if (camMode && !wrapC) { wrapC = el("div","camtext"); vp.prepend(wrapC); wrapC.append(ptext, pts, guide); }
    if (!camMode && wrapC) { vp.append(ptext, pts, guide); wrapC.remove(); }
    renderText(); showHud(); runTimer(); lockScreen();
    try { if (!camMode && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e){}
    if (camMode) startCam();
  }
  async function startCam(){
    const msg = $("camMsg"); msg.hidden = true;
    stopStream();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.hidden = false; msg.textContent = "Този браузър не дава достъп до камерата."; return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:S.facing, width:{ideal:1920}, height:{ideal:1080} }, audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:true } });
      const v = $("cam"); v.srcObject = stream; v.classList.toggle("selfie", S.facing === "user"); await v.play().catch(()=>{});
    } catch(e) {
      msg.hidden = false; msg.textContent = "Нямам достъп до камерата или микрофона. Разреши ги от иконката с катинарчето до адреса и опитай пак.";
    }
  }
  function stopStream(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  function pickType(){
    const types = ["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
    if (!window.MediaRecorder) return null;
    return types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch(e){ return false; } }) || "";
  }
  async function toggleRec(){
    if (rec && rec.state === "recording") { stopRec(); return; }
    if (!stream) { toast("Камерата не е включена"); return; }
    const type = pickType();
    if (type === null) { toast("Този телефон не може да записва видео оттук."); return; }
    await countdown();
    chunks = [];
    try { rec = new MediaRecorder(stream, type ? {mimeType:type, videoBitsPerSecond:8000000} : undefined); }
    catch(e) { try { rec = new MediaRecorder(stream); } catch(e2) { toast("Записът не може да започне."); return; } }
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = finishRec;
    rec.start(1000);
    recStart = Date.now(); $("recDot").hidden = false; $("hRec").classList.add("on"); $("hRec").setAttribute("aria-label","Спри записа");
    offset = 0; idx = 0; renderText();
    play();
  }
  function stopRec(){ if (rec && rec.state !== "inactive") rec.stop(); pause(); recStart = 0; $("recDot").hidden = true; $("hRec").classList.remove("on"); $("hRec").setAttribute("aria-label","Запис"); }
  function finishRec(){
    const type = (rec && rec.mimeType) || "video/webm";
    const blob = new Blob(chunks, {type});
    const ext = /mp4/.test(type) ? "mp4" : "webm";
    const name = "dubal-" + new Date().toISOString().slice(0,16).replace(/[:T]/g,"-") + "." + ext;
    const url = URL.createObjectURL(blob);
    const sh = el("div","sheet"), box = el("div","box");
    box.append(el("h2", null, "Дубълът е готов 🎬"));
    const v = el("video"); v.src = url; v.controls = true; v.playsInline = true; box.append(v);
    const bar = el("div","bar");
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      const s = el("button","btn rec","Сподели / Запази"); s.onclick = async () => { try { await navigator.share({files:[file], title:name}); } catch(e){} }; bar.append(s);
    }
    const d = el("button","btn","Изтегли"); d.onclick = () => { const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); toast("Видеото е в „Изтегляния“"); }; bar.append(d);
    const again = el("button","btn ghost","Нов дубъл"); again.onclick = () => { URL.revokeObjectURL(url); sh.remove(); restart(); }; bar.append(again);
    box.append(bar);
    if (ext === "webm") box.append(el("p","note","Видеото е във формат WebM. Ако CapCut не го приеме, пусни го през безплатен конвертор към MP4."));
    sh.append(box); document.body.append(sh);
  }
  function closeStage(){
    if (rec && rec.state === "recording") { if (!confirm("Записът ще спре. Да затворя ли?")) return; stopRec(); }
    pause(); cancelAnimationFrame(raf); clearInterval(tick); stopStream();
    try { if (wake) { wake.release(); wake = null; } } catch(e){}
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){}
    $("stage").hidden = true; document.body.style.overflow = ""; renderHome();
  }

  // докосвания
  vp.addEventListener("click", e => {
    if (S.mode === "points") { const r = vp.getBoundingClientRect(); next(e.clientX < r.width*0.3 ? -1 : 1); }
    else if (!camMode) { if ($("hud").classList.contains("hide")) { showHud(); hudLater(); } else togglePlay(); }
    else togglePlay();
  });
  $("hPlay").onclick = togglePlay;
  $("hRec").onclick = toggleRec;
  $("hClose").onclick = closeStage;
  $("hRestart").onclick = restart;
  $("hMode").onclick = () => { S.mode = S.mode === "scroll" ? "points" : "scroll"; save(); offset = 0; idx = 0; renderText(); if (playing && S.mode === "scroll") { last = 0; raf = requestAnimationFrame(loop); } };
  $("hSlow").onclick = () => { S.speed = Math.max(10, S.speed - 5); save(); toast("Скорост " + S.speed); };
  $("hFast").onclick = () => { S.speed = Math.min(140, S.speed + 5); save(); toast("Скорост " + S.speed); };
  $("hSize").onclick = () => { S.size = S.size >= 64 ? 28 : S.size + 6; save(); layout(); toast("Размер " + S.size); };
  $("hFlip").onclick = () => { if (rec && rec.state === "recording") { toast("Спри записа първо"); return; } S.facing = S.facing === "user" ? "environment" : "user"; save(); startCam(); };
  document.addEventListener("keydown", e => {
    if ($("stage").hidden) return;
    if (e.key === " ") { e.preventDefault(); camMode ? toggleRec() : togglePlay(); }
    else if (e.key === "ArrowRight" || e.key === "ArrowDown") { if (S.mode === "points") next(1); else { offset += 60; layout(); } }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { if (S.mode === "points") next(-1); else { offset = Math.max(0, offset - 60); layout(); } }
    else if (e.key === "Escape") closeStage();
  });
  window.addEventListener("resize", () => { if (!$("stage").hidden) layout(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("stage").hidden) lockScreen(); });

  renderHome();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
